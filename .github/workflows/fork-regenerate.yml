name: Fork Regenerate

# Fork-only maintenance task. Upstream releases generate these contracts inside
# the normal release plan; this workflow exists so a fork without a published
# stable release can still regenerate reviewed contracts on GitHub Actions
# instead of a developer machine or the production VPS.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: fork-regenerate-${{ inputs.branch }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.11"

jobs:
  regenerate:
    name: Regenerate contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate OpenAPI, docs, CLI, and automation contracts
        run: |
          bun scripts/sync-docs-openapi.mjs
          bun run --filter @openpost/web generate:types
          bun scripts/generate-selected-automation-contract.mjs
      - name: Commit generated output
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "openpost-fork-bot"
          git config user.email "openpost-fork-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(contracts): regenerate API and automation contracts"
          git push origin "HEAD:${{ inputs.branch }}"
