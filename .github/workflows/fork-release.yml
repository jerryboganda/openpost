name: Fork Release

# Fork-only delivery path: build and smoke-test the production image on GitHub
# Actions, publish it by digest, then deploy that exact digest to this VPS with
# a database backup and automatic rollback. The production VPS never builds.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Build a new image or deploy an already tested digest
        required: true
        default: build-and-deploy
        type: choice
        options: [build-and-deploy, deploy-only]
      image:
        description: Digest-pinned image for deploy-only mode
        required: false
        type: string
      revision:
        description: Full git sha for deploy-only mode
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.11"
  IMAGE: ghcr.io/jerryboganda/openpost

jobs:
  build:
    name: Build and smoke-test the image
    if: github.event_name == 'push' || inputs.mode == 'build-and-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      revision: ${{ github.sha }}
      image: ghcr.io/jerryboganda/openpost
      version: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the canonical frontend
        run: bun run build -- frontend
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the candidate locally
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-context frontend_artifact=apps/server/cmd/openpost/public \
            --file deploy/docker/Dockerfile \
            --tag "openpost:fork-candidate" \
            --build-arg VERSION="sha-${GITHUB_SHA}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --cache-from type=gha,scope=fork-production \
            --cache-to type=gha,mode=max,scope=fork-production \
            .
      - name: Smoke-test the candidate
        run: scripts/smoke-production-image.sh openpost:fork-candidate "$GITHUB_SHA" "sha-${GITHUB_SHA}" amd64
      - name: Publish the tested image
        id: push
        run: |
          docker tag openpost:fork-candidate "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" | awk '$1 == "Digest:" && !found { print $2; found = 1 }')"
          [[ "$digest" == sha256:* ]] || { echo "missing image digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > image-digest.txt
          printf 'image=%s@%s\nrevision=%s\n' "${IMAGE}" "$digest" "$GITHUB_SHA" > image-proof.txt
      - name: Allow anonymous pulls when the package can be published
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH /user/packages/container/openpost -f visibility=public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-image-proof-${{ github.sha }}
          path: |
            image-digest.txt
            image-proof.txt
          if-no-files-found: error

  deploy:
    name: Deploy the tested digest
    needs: build
    if: |
      always() && vars.OPENPOST_DEPLOY_ENABLED == 'true' &&
      (needs.build.result == 'success' || inputs.mode == 'deploy-only')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Resolve the tested digest
        id: target
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_IMAGE: ${{ needs.build.outputs.image }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          if [[ "${{ inputs.mode }}" == "deploy-only" ]]; then
            image="${INPUT_IMAGE}"
            revision="${INPUT_REVISION}"
          else
            image="${BUILD_IMAGE}@${BUILD_DIGEST}"
            revision="${GITHUB_SHA}"
          fi
          [[ "$image" == *"@sha256:"* ]] || { echo "image must be digest-pinned"; exit 1; }
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "revision must be a full git sha"; exit 1; }
          {
            echo "image=$image"
            echo "revision=$revision"
            echo "version=sha-${revision}"
          } >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/openpost_deploy
          chmod 600 ~/.ssh/openpost_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Log in to GHCR on the VPS when a read token is configured
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        if: env.GHCR_READ_TOKEN != ''
        run: |
          printf '%s' "$GHCR_READ_TOKEN" |
            ssh -i ~/.ssh/openpost_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Copy the deployment script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/openpost_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy/vps/deploy.sh "${VPS_USER}@${VPS_HOST}:/opt/docker/openpost/deploy.sh"
      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TARGET_IMAGE: ${{ steps.target.outputs.image }}
          TARGET_REVISION: ${{ steps.target.outputs.revision }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          PUBLIC_URL: ${{ vars.OPENPOST_PUBLIC_URL }}
        run: |
          ssh -i ~/.ssh/openpost_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${VPS_USER}@${VPS_HOST}" \
            "chmod 700 /opt/docker/openpost/deploy.sh && /opt/docker/openpost/deploy.sh --image '${TARGET_IMAGE}' --revision '${TARGET_REVISION}' --version '${TARGET_VERSION}' ${PUBLIC_URL:+--public-url '$PUBLIC_URL'}"
