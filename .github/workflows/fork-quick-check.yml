name: Fork Quick Check

# Fork-only fast feedback for feature, fix, and agent branches. It runs the Go
# build, vet, lint, and focused tests, plus the web lint and type check, in a
# few minutes instead of the roughly 40 minutes of the full pull request checks.
# The full checks still gate every merge. The administrator agent starts this
# workflow by pushing to an agent/* branch and reads the result with ci_status.
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "agent/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: fork-quick-check-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"

jobs:
  backend:
    name: Backend build, lint, and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Install the pinned Go linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-only: true
      - name: Format the Go sources
        working-directory: apps/server
        run: gofmt -w .
      # The dev tag serves the web app from disk, so the Go checks do not need
      # the embedded frontend build.
      - name: Build and vet
        working-directory: apps/server
        run: |
          go build -tags dev ./...
          go vet -tags dev ./internal/ai/... ./internal/services/adminagent/... ./internal/api/... ./internal/operational/... ./cmd/...
      - name: Lint
        working-directory: apps/server
        run: golangci-lint run --build-tags dev ./internal/ai/... ./internal/services/adminagent/... ./internal/api/... ./internal/operational/... ./cmd/...
      - name: Focused tests
        working-directory: apps/server
        run: |
          go test ./internal/ai/... ./internal/services/adminagent/... ./internal/operational/...
          go test ./internal/api
          go test ./internal/api/handlers -run 'AdminAgent|AIDiagnostic'

  web:
    name: Web lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint -- frontend
      - name: Type check
        run: bun run check -- frontend
