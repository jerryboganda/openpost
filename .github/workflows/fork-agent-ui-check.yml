name: Fork Agent UI Check

# Opens the administrator Agent in a real browser against a freshly built app
# and keeps screenshots at desktop and phone widths in light and dark. The
# agent's own API is replaced with fixtures, so the check shows how the chat
# looks and behaves without calling a model. The full browser suites still gate
# every merge. Editing this file runs it, because a workflow that is not on the
# default branch yet cannot be dispatched by hand.
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "agent/**"
    paths:
      - ".github/workflows/fork-agent-ui-check.yml"
      - "tests/app/agent-chat.spec.ts"
      - "apps/web/src/lib/agent/**"
      - "apps/web/src/lib/components/agent/**"
      - "apps/web/src/routes/agent/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: fork-agent-ui-check-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"

jobs:
  browser:
    name: Agent chat in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: bunx --no-install playwright install --with-deps chromium
      - name: Build the web app
        run: bun run build -- frontend
      # The test server starts with go run, which has a short start-up window.
      - name: Compile the server
        working-directory: apps/server
        run: go build -tags dev -o /dev/null ./cmd/openpost
      - name: Run the Agent chat checks
        env:
          OPENPOST_E2E_PREBUILT: "1"
        run: bunx --no-install playwright test --config tests/app/playwright.config.ts --retries=0 agent-chat.spec.ts
      - name: Keep the screenshots and the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-ui-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
