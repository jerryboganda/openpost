name: OpenPost Agent Run

# Executes one administrator-requested coding task with the selected engine.
# The prompt is fetched from OpenPost over a signed request, so it never appears
# in workflow dispatch inputs or public run metadata.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: OpenPost agent run id
        required: true
        type: string
      callback_url:
        description: Signed progress callback URL
        required: true
        type: string
      context_url:
        description: Signed run context URL
        required: true
        type: string

run-name: openpost-agent-${{ inputs.run_id }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openpost-agent-${{ inputs.run_id }}
  cancel-in-progress: false

env:
  OPENPOST_AGENT_RUN_ID: ${{ inputs.run_id }}
  OPENPOST_AGENT_CALLBACK_URL: ${{ inputs.callback_url }}

jobs:
  agent:
    name: Run the selected engine
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      OPENPOST_AGENT_CALLBACK_SECRET: ${{ secrets.OPENPOST_AGENT_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Fetch the run context
        id: context
        run: |
          node scripts/agent-context.mjs \
            --url "${{ inputs.context_url }}" \
            --run-id "${{ inputs.run_id }}" \
            --output "$RUNNER_TEMP/agent-context.json"
          engine="$(jq -r .engine "$RUNNER_TEMP/agent-context.json")"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

      - name: Check engine credentials
        id: credentials
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          engine="${{ steps.context.outputs.engine }}"
          missing=""
          case "$engine" in
            opencode)
              [ -z "${OPENCODE_API_KEY}${OPENAI_API_KEY}${ANTHROPIC_API_KEY}" ] && missing="OPENCODE_API_KEY, OPENAI_API_KEY, or ANTHROPIC_API_KEY"
              ;;
            codex)
              [ -z "${OPENAI_API_KEY}" ] && missing="OPENAI_API_KEY"
              ;;
            claude)
              [ -z "${ANTHROPIC_API_KEY}" ] && missing="ANTHROPIC_API_KEY"
              ;;
            *)
              node scripts/agent-callback.mjs --status failed \
                --failure-code unsupported_engine \
                --failure-message "The requested engine is not supported."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ -n "$missing" ]; then
            node scripts/agent-callback.mjs --status failed \
              --failure-code missing_credentials \
              --failure-message "The ${engine} engine is missing ${missing} in GitHub Actions secrets."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Announce the run
        if: steps.credentials.outputs.available == 'true'
        run: |
          node scripts/agent-callback.mjs --status running \
            --event "phase-start|progress|Engine ${{ steps.context.outputs.engine }} started in GitHub Actions."

      - name: Install the engine
        if: steps.credentials.outputs.available == 'true'
        run: |
          case "${{ steps.context.outputs.engine }}" in
            opencode) npm install --global opencode-ai ;;
            codex) npm install --global @openai/codex ;;
            claude) npm install --global @anthropic-ai/claude-code ;;
          esac

      - name: Build the OpenPost CLI
        if: steps.credentials.outputs.available == 'true'
        run: |
          (cd apps/cli && go build -o /usr/local/bin/openpost ./cmd/openpost)
          openpost version || true

      - name: Run the engine
        id: engine
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENPOST_TOKEN: ${{ secrets.OPENPOST_AGENT_API_TOKEN }}
          OPENPOST_INSTANCE: ${{ vars.OPENPOST_PUBLIC_URL }}
          OPENPOST_WORKSPACE: ${{ vars.OPENPOST_AGENT_WORKSPACE }}
        run: |
          prompt="$(jq -r .prompt "$RUNNER_TEMP/agent-context.json")"
          preamble="You are the OpenPost administrator agent running in a GitHub Actions checkout. Follow the administrator's task. Never print, commit, or push secrets or .env files. Use the openpost CLI (OPENPOST_INSTANCE and OPENPOST_TOKEN are set) for accounts, posts, schedules, and workflows when the task needs them; report provider or permission limits truthfully. Leave changes uncommitted so the workflow can open a branch and pull request."
          task="${preamble}"$'\n\n'"${prompt}"
          status=0
          case "${{ steps.context.outputs.engine }}" in
            opencode) timeout 2700 opencode run "$task" || status=$? ;;
            codex) timeout 2700 codex exec --full-auto "$task" || status=$? ;;
            claude) timeout 2700 claude -p "$task" --permission-mode acceptEdits --output-format text || status=$? ;;
          esac
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Publish a reviewable branch
        id: publish
        if: steps.credentials.outputs.available == 'true' && steps.engine.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git status --porcelain --untracked-files=all | grep -Eq '(^|/)\.env(\.local|\.production|\.development)?$'; then
            node scripts/agent-callback.mjs --status failed \
              --failure-code secret_detected \
              --failure-message "The engine produced an .env file; the change was not committed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="agent/${OPENPOST_AGENT_RUN_ID}"
          git config user.name "openpost-agent"
          git config user.email "openpost-agent@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "agent: automated change for run ${OPENPOST_AGENT_RUN_ID}"
          git push origin "$branch"
          url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "agent: automated change for run ${OPENPOST_AGENT_RUN_ID}" \
            --body "Automated change requested through the OpenPost administrator agent. Run: ${OPENPOST_AGENT_RUN_ID}. Repository checks run on this pull request; review the diff before merging.")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Report the result
        if: always() && steps.credentials.outputs.available == 'true'
        run: |
          if [ "${{ steps.engine.outcome }}" = "success" ]; then
            if [ "${{ steps.publish.outputs.changed }}" = "true" ]; then
              summary="Engine completed and opened a pull request: ${{ steps.publish.outputs.url }}. Repository checks run on that pull request."
            else
              summary="Engine completed without code changes."
            fi
            node scripts/agent-callback.mjs --status succeeded \
              --summary "$summary" \
              --branch "agent/${OPENPOST_AGENT_RUN_ID}" \
              --event "phase-complete|result|${summary}"
          else
            code="${{ steps.engine.outputs.exit_code }}"
            node scripts/agent-callback.mjs --status failed \
              --failure-code engine_failed \
              --failure-message "The engine exited with code ${code:-unknown}. See the GitHub Actions run for details."
          fi
